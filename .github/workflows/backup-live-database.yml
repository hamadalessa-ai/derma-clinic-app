# Nightly encrypted backup of the LIVE database (on top of Supabase's own daily backups).
# 01:00 Riyadh time. Each copy is test-restored before it is kept, encrypted with
# BACKUP_PASSPHRASE (AES-256) and kept 30 days as a workflow artifact. Does nothing until
# LIVE_BACKUP_URL is set. Founder guide: docs/GO_LIVE.md.
#
# Secrets: LIVE_BACKUP_URL (read-only backup_reader login), BACKUP_PASSPHRASE,
#          optional OPS_ALERT_WEBHOOK_URL.
name: Backup live database

on:
  schedule:
    - cron: "7 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: live-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      scratch:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: scratch
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Is the live system set up?
        id: ready
        env:
          LIVE_BACKUP_URL: ${{ secrets.LIVE_BACKUP_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$LIVE_BACKUP_URL" ]; then echo "No LIVE_BACKUP_URL yet: nothing to back up."; echo "go=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ ${#BACKUP_PASSPHRASE} -lt 20 ]; then echo "BACKUP_PASSPHRASE must be set (20+ characters)."; exit 1; fi
          echo "go=yes" >> "$GITHUB_OUTPUT"
      - name: Install PostgreSQL 17 tools
        if: steps.ready.outputs.go == 'yes'
        run: scripts/backup/install-pg-client.sh
      - name: Back up, test-restore, encrypt
        if: steps.ready.outputs.go == 'yes'
        env:
          LIVE_BACKUP_URL: ${{ secrets.LIVE_BACKUP_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          RESTORE_URL: postgresql://postgres:scratch@localhost:5432/postgres
        run: scripts/backup/backup.sh
      - uses: actions/upload-artifact@v4
        if: steps.ready.outputs.go == 'yes'
        with:
          name: live-backup
          path: backup/*.tar.gpg
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
      - name: Alert on failure
        if: failure()
        env:
          URL: ${{ secrets.OPS_ALERT_WEBHOOK_URL }}
        run: scripts/backup/alert.sh "Live database backup FAILED"
