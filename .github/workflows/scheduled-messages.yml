# Sends the clinic's scheduled WhatsApp messages (reminders, post-care, no-show, recalls) every hour.
# Vercel's free plan only allows a daily job, so GitHub calls the app instead (free).
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   APP_URL      the main app link, e.g. https://derma-clinic-app.vercel.app (no slash at the end)
#   CRON_SECRET  the same value as CRON_SECRET in Vercel
# For the live system also LIVE_APP_URL + LIVE_CRON_SECRET (docs/GO_LIVE.md); skipped until set.
# Safe to run twice: the app never sends the same message twice. GitHub may start runs a few
# minutes late; the app catches up.
name: Scheduled WhatsApp messages

on:
  schedule:
    - cron: "7 * * * *" # every hour at minute 7 (UTC)
  workflow_dispatch: {} # "Run workflow" button for a manual run

permissions: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Call the app (demo, then live when set up)
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          LIVE_APP_URL: ${{ secrets.LIVE_APP_URL }}
          LIVE_CRON_SECRET: ${{ secrets.LIVE_CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Add the APP_URL and CRON_SECRET secrets (see docs/DEPLOY.md)."
            exit 1
          fi
          failed=0
          call() {
            # Each call stops before its time limit and answers "more": true when messages are left;
            # call again (at most 6 times) so a busy hour still finishes.
            for i in 1 2 3 4 5 6; do
              body=$(curl --fail-with-body --silent --show-error --max-time 120 \
                -H "Authorization: Bearer $2" "${1%/}/api/cron/messages") || { echo "$body"; failed=1; return; }
              echo "$body"
              echo "$body" | grep -q '"more":true' || break
            done
          }
          call "$APP_URL" "$CRON_SECRET"
          if [ -n "$LIVE_APP_URL" ] && [ -n "$LIVE_CRON_SECRET" ]; then
            echo "— live —"
            call "$LIVE_APP_URL" "$LIVE_CRON_SECRET"
          fi
          exit $failed
