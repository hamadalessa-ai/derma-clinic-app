# Security check of the libraries we ship: fails when a known HIGH or CRITICAL vulnerability is
# in a production dependency. Runs every week, on pull requests that change dependencies, and by hand.
name: Security audit

on:
  schedule:
    - cron: "17 3 * * 0" # Sundays 06:17 Riyadh
  pull_request:
    paths: ["package.json", "pnpm-lock.yaml"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Known vulnerabilities in production libraries (high and critical)
        run: pnpm audit --prod --audit-level high
