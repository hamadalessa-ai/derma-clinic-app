# Regenerates the generated files on a branch and commits them back:
#   db/migrations (drizzle-kit), db/setup.sql + db/reset.sql, docs/WHATSAPP_TEMPLATES.md,
# then formats the code. Used when the editing workspace can't install the project's tools.
# Run it from Actions → "Regenerate files" → Run workflow, choosing the branch.
name: Regenerate files

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to regenerate (never main)
        required: true

permissions:
  contents: write

concurrency:
  group: regenerate-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  regenerate:
    if: ${{ inputs.branch != 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:build-setup
      - run: pnpm docs:whatsapp
      - run: pnpm exec prettier --write .
      - name: Commit the regenerated files
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to regenerate."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Regenerate migrations, setup.sql, reset.sql and docs"
          git push origin "HEAD:${{ inputs.branch }}"
