# Checks the WhatsApp AI receptionist against the REAL model on typical patient messages
# (medical questions → staff, no booking before "yes", the patient's language).
# Run by hand: Actions → "AI receptionist check" → Run workflow. Costs a few cents per run.
# Needs the repository secret ANTHROPIC_API_KEY (Settings → Secrets and variables → Actions).
name: AI receptionist check

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: localdev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL_ADMIN: postgresql://postgres:localdev@127.0.0.1:5432/postgres
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the check
        run: pnpm test:ai-live
