# Makes clean doctor portraits (background removed) from the photos the clinic publishes,
# and commits them to the branch it runs on (public/site/derma/doctors/). Runs when the list or
# script changes on a claude/* branch, or from Actions.
name: Doctor portraits

on:
  workflow_dispatch: {}
  push:
    branches: ["claude/**"]
    paths: ["scripts/cutouts/**"]

permissions:
  contents: write

jobs:
  cutouts:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "rembg[cpu]" pillow numpy scipy
      # rembg may pull a second OpenCV build; keep exactly one (with face detection).
      - run: pip uninstall -y opencv-python opencv-python-headless opencv-contrib-python || true; pip install opencv-python-headless; python -c "import cv2; cv2.CascadeClassifier"
      - run: python scripts/cutouts/cutouts.py
      - name: Commit the portraits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/site/derma/doctors scripts/cutouts/preview.png
          git diff --cached --quiet || git commit -m "Doctor portraits (background removed)"
          git push
