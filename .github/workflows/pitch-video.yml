# Pitch video: films the LIVE demo (scripts/pitch/capture.mjs) and, when the composer exists,
# renders the video (scripts/pitch/render.mjs) and its two sound versions (scripts/pitch/audio.py:
# music only, and an Arabic voiceover by Piper). Results are published on the "pitch-video-v2" branch
# (the first video stays on "pitch-video").
# Runs on pushes that change scripts/pitch/** on claude/** branches, or by hand.
name: Pitch video

on:
  workflow_dispatch: {}
  push:
    branches: ["claude/**"]
    paths: ["scripts/pitch/**", ".github/workflows/pitch-video.yml"]

permissions:
  contents: write

concurrency:
  group: pitch-video
  cancel-in-progress: true

jobs:
  film:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PITCH_BASE_URL: https://derma-clinic-app.vercel.app
      DEMO_STAFF_PASSWORD: ${{ secrets.DEMO_STAFF_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Film the live demo
        if: ${{ !contains(github.event.head_commit.message, '[render-only]') }}
        run: node scripts/pitch/capture.mjs
      - name: Reuse the last filming
        if: ${{ contains(github.event.head_commit.message, '[render-only]') }}
        run: |
          git fetch -q origin pitch-video-v2
          mkdir -p pitch && git archive origin/pitch-video-v2 shots | tar -x -C pitch
      - name: Render the video
        run: |
          if [ -f scripts/pitch/render.mjs ]; then
            sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji > /dev/null
            node scripts/pitch/render.mjs
            rm -rf pitch/out/scenes
          fi
      - name: Sound (music, and an Arabic voiceover)
        run: |
          if [ -f pitch/out/derma-pitch.mp4 ]; then
            pip install -q piper-tts
            mkdir -p voice
            # The ElevenLabs recordings (signed links, valid a few hours), one per scene.
            n=0; while read -r url; do curl -sfL -o "voice/line-$n.mp3" "$url" || echo "line $n not downloaded"; n=$((n+1)); done < scripts/pitch/voice-el.txt
            # One continuous take of the whole script (more natural); audio.py splits it per scene.
            if [ -f scripts/pitch/voice-full.txt ]; then curl -sfL -o voice/full.mp3 "$(head -1 scripts/pitch/voice-full.txt)" || echo "full take not downloaded"; fi
            V=https://huggingface.co/rhasspy/piper-voices/resolve/main/ar/ar_JO/kareem/medium
            curl -sfL -o voice/ar_JO-kareem-medium.onnx $V/ar_JO-kareem-medium.onnx
            curl -sfL -o voice/ar_JO-kareem-medium.onnx.json $V/ar_JO-kareem-medium.onnx.json
            python3 scripts/pitch/audio.py voice/ar_JO-kareem-medium.onnx
            rm -rf pitch/out/voice
          fi
      - name: Publish on the pitch-video-v2 branch
        if: always()
        run: |
          mkdir -p /tmp/pub && cp -r pitch/* /tmp/pub/ 2>/dev/null || true
          cd /tmp/pub
          git init -q -b pitch-video-v2
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Pitch video v2 from ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" pitch-video-v2
