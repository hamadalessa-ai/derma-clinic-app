# Weekly check for updates of the libraries we use: minor and patch updates grouped in ONE pull
# request (the "Tests" workflow checks it before anyone merges). Major versions are planned by hand.
# Only the main branch deploys on Vercel (vercel.json), so these never use up deployments.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: sunday
      timezone: Asia/Riyadh
    open-pull-requests-limit: 2
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Big version jumps change how libraries work: we plan those ourselves, not automatically.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
