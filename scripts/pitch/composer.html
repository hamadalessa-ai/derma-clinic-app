<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@600;700&display=block" rel="stylesheet" />
<style>
  :root {
    --emerald: #0b5d4c;
    --emerald-deep: #073f34;
    --gold: #b8975a;
    --champagne: #e9dcc2;
    --ivory: #fbf9f4;
    --ink: #1f2a2e;
    --slate: #4a5a60;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ivory); }
  body { font-family: "IBM Plex Sans Arabic", sans-serif; color: var(--ink); position: relative; }
  .layer { position: absolute; inset: 0; }
  #bg { background: radial-gradient(1200px 900px at 85% 10%, #eef4f1 0%, transparent 60%),
                    radial-gradient(1000px 900px at 10% 95%, #f4ede0 0%, transparent 60%), var(--ivory); }
  .blob { position: absolute; border-radius: 50%; filter: blur(60px); opacity: .5; }
  .kicker { position: absolute; top: 150px; right: 90px; left: 90px; font-size: 30px; font-weight: 600;
            color: var(--gold); letter-spacing: 0; }
  .title { position: absolute; top: 205px; right: 90px; left: 90px; font-family: "Noto Naskh Arabic", serif;
           font-weight: 700; font-size: 74px; line-height: 1.25; color: var(--ink); }
  .title em { font-style: normal; color: var(--emerald); }
  .sub { position: absolute; right: 90px; left: 90px; font-size: 36px; line-height: 1.5; color: var(--slate); font-weight: 500; }
  .device { position: absolute; left: 50%; transform-origin: 50% 50%; }
  .phone { width: 600px; height: 1298px; border-radius: 86px; background: #0d1416; padding: 18px;
           box-shadow: 0 60px 120px -30px rgba(7,63,52,.45), 0 0 0 2px #2a3336 inset; }
  .phone .screen { width: 100%; height: 100%; border-radius: 70px; overflow: hidden; position: relative; background: #fff; }
  .phone .notch { position: absolute; top: 30px; left: 50%; width: 170px; height: 46px; margin-left: -85px;
                  background: #0d1416; border-radius: 30px; z-index: 5; }
  .laptop { width: 980px; }
  .laptop .lid { background: #0d1416; border-radius: 34px 34px 10px 10px; padding: 22px 22px 30px; box-shadow: 0 60px 120px -30px rgba(7,63,52,.4); }
  .laptop .screen { width: 936px; height: 585px; overflow: hidden; position: relative; border-radius: 8px; background: #fff; }
  .laptop .base { height: 34px; margin: 0 -50px; background: linear-gradient(#d9dde0, #aeb4b8); border-radius: 0 0 40px 40px; }
  .shot { position: absolute; top: 0; left: 0; width: 100%; will-change: transform, opacity; }
  .chip { position: absolute; display: inline-flex; align-items: center; gap: 14px; padding: 18px 30px; border-radius: 999px;
          background: #fff; box-shadow: 0 18px 40px -16px rgba(7,63,52,.35); font-size: 32px; font-weight: 600; color: var(--emerald-deep); white-space: nowrap; }
  .chip i { width: 16px; height: 16px; border-radius: 50%; background: var(--gold); display: inline-block; }
  .tap { position: absolute; width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%;
         border: 6px solid rgba(184,151,90,.95); background: rgba(184,151,90,.18); }
  .logo { position: absolute; left: 50%; transform: translateX(-50%); }
  .center { position: absolute; left: 90px; right: 90px; text-align: center; }
  .progress { position: absolute; bottom: 70px; left: 90px; right: 90px; height: 6px; border-radius: 6px; background: rgba(11,93,76,.12); overflow: hidden; }
  .progress div { height: 100%; background: var(--emerald); border-radius: 6px; }
  .notice { position: absolute; bottom: 100px; left: 90px; right: 90px; text-align: center; font-size: 24px; color: #8a979b; }
</style>
</head>
<body>
<div id="bg" class="layer"></div>
<div id="stage" class="layer"></div>
<script src="./composer.js"></script>
</body>
</html>
